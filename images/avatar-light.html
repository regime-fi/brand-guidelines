<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
<script src="../node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { margin: 0; padding: 0; }
  body {
    width: 400px;
    height: 400px;
    overflow: hidden;
    background: #FAFBFD;
  }
  #chart {
    position: absolute;
    top: 0; left: 0;
    width: 400px;
    height: 400px;
    z-index: 0;
  }
  .vignette {
    position: absolute;
    top: 0; left: 0;
    width: 400px;
    height: 400px;
    z-index: 1;
    background: radial-gradient(
      ellipse 70% 60% at 50% 50%,
      rgba(250,251,253,0.85) 0%,
      rgba(250,251,253,0.6) 40%,
      rgba(250,251,253,0.2) 70%,
      transparent 100%
    );
  }
  .content {
    position: absolute;
    top: 0; left: 0;
    width: 400px;
    height: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .mark {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 190px;
    line-height: 0.85;
    letter-spacing: -5px;
    color: #111827;
    user-select: none;
    text-shadow:
      0 0 30px #FAFBFD,
      0 0 50px #FAFBFD,
      0 0 80px #FAFBFD,
      0 0 120px #FAFBFD,
      0 0 160px #FAFBFD,
      0 0 200px rgba(250,251,253,0.95),
      0 0 250px rgba(250,251,253,0.9),
      0 0 300px rgba(250,251,253,0.8);
  }
  .wordmark {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 38px;
    line-height: 1;
    letter-spacing: 2.5px;
    margin-top: -2px;
    user-select: none;
    text-shadow:
      0 0 20px #FAFBFD,
      0 0 40px #FAFBFD,
      0 0 70px #FAFBFD,
      0 0 100px #FAFBFD,
      0 0 140px #FAFBFD,
      0 0 180px rgba(250,251,253,0.95),
      0 0 220px rgba(250,251,253,0.9);
  }
  .regime { color: #111827; }
  .fi { color: #00A88E; letter-spacing: -1px; }
</style>
</head>
<body>
  <div id="chart"></div>
  <div class="vignette"></div>
  <div class="content">
    <div class="mark">R</div>
    <div class="wordmark"><span class="regime">REGIME</span><span class="fi">.fi</span></div>
  </div>
<script>
  // Deterministic random
  let seed = 77;
  function rand() {
    seed = (seed * 16807 + 0) % 2147483647;
    return (seed - 1) / 2147483646;
  }

  const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    width: 400,
    height: 400,
    layout: {
      background: { color: '#FAFBFD' },
      textColor: 'transparent',
      attributionLogo: false,
    },
    grid: {
      vertLines: { color: 'rgba(45,106,255,0.10)' },
      horzLines: { color: 'rgba(45,106,255,0.10)' },
    },
    timeScale: {
      visible: false,
      borderVisible: false,
    },
    rightPriceScale: {
      visible: false,
      borderVisible: false,
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Hidden,
    },
    handleScroll: false,
    handleScale: false,
  });

  const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
    upColor: '#00B377',
    downColor: '#E0435C',
    borderUpColor: '#00B377',
    borderDownColor: '#E0435C',
    wickUpColor: '#00B377',
    wickDownColor: '#E0435C',
    lastValueVisible: false,
    priceLineVisible: false,
  });

  function generateUptrend(count) {
    const data = [];
    let price = 50;
    const baseDate = new Date('2024-01-01');

    const phases = [
      { len: 8,  drift: 0.15, vol: 2.0, upPct: 0.50 },
      { len: 6,  drift: 1.0,  vol: 3.0, upPct: 0.72 },
      { len: 7,  drift: -0.15,vol: 2.0, upPct: 0.38 },
      { len: 5,  drift: 0.05, vol: 1.2, upPct: 0.50 },
      { len: 8,  drift: 0.7,  vol: 2.8, upPct: 0.65 },
      { len: 4,  drift: -0.2, vol: 2.2, upPct: 0.35 },
      { len: 10, drift: 0.9,  vol: 3.5, upPct: 0.68 },
      { len: 5,  drift: 0.0,  vol: 1.5, upPct: 0.45 },
      { len: 7,  drift: 1.3,  vol: 4.5, upPct: 0.75 },
    ];

    let idx = 0;
    for (const phase of phases) {
      for (let j = 0; j < phase.len && idx < count; j++, idx++) {
        const date = new Date(baseDate);
        date.setDate(date.getDate() + idx);
        const time = date.toISOString().split('T')[0];

        const vol = phase.vol * (0.5 + rand() * 1.0);
        const isUp = rand() < phase.upPct;
        let open = price, close, high, low;

        if (isUp) {
          close = open + phase.drift + rand() * vol;
          high = close + rand() * vol * 0.6;
          low = open - rand() * vol * 0.4;
        } else {
          close = open - Math.abs(phase.drift * 0.5) - rand() * vol * 0.7;
          high = open + rand() * vol * 0.5;
          low = close - rand() * vol * 0.4;
        }

        if (rand() < 0.07) {
          if (isUp) { close = open + vol * 2.2; high = close + rand() * 0.3; }
          else { close = open - vol * 1.5; low = close - rand() * 0.3; }
        }
        if (rand() < 0.08) {
          close = open + (rand() - 0.5) * 0.5;
          high = Math.max(open, close) + rand() * vol * 1.2;
          low = Math.min(open, close) - rand() * vol * 1.2;
        }

        data.push({
          time,
          open: Math.round(open * 100) / 100,
          high: Math.round(Math.max(high, open, close) * 100) / 100,
          low: Math.round(Math.min(low, open, close) * 100) / 100,
          close: Math.round(close * 100) / 100,
        });
        price = close;
      }
    }
    return data;
  }

  candleSeries.setData(generateUptrend(60));
  chart.timeScale().fitContent();
</script>
</body>
</html>
