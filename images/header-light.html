<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="../node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; }
  body {
    width: 1500px;
    height: 500px;
    overflow: hidden;
    background: #FAFBFD;
  }
  #chart {
    position: absolute;
    top: 0; left: 0;
    width: 1500px;
    height: 500px;
    z-index: 0;
  }
  .vignette {
    position: absolute;
    top: 0; left: 0;
    width: 1500px;
    height: 500px;
    z-index: 1;
    background: radial-gradient(
      ellipse 50% 70% at 50% 50%,
      rgba(250,251,253,0.8) 0%,
      rgba(250,251,253,0.5) 35%,
      rgba(250,251,253,0.15) 65%,
      transparent 100%
    );
  }
  .content {
    position: absolute;
    top: 0; left: 0;
    width: 1500px;
    height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .wordmark {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 52px;
    line-height: 1;
    letter-spacing: 4px;
    user-select: none;
    text-shadow:
      0 0 20px #FAFBFD,
      0 0 40px #FAFBFD,
      0 0 70px #FAFBFD,
      0 0 100px #FAFBFD,
      0 0 140px #FAFBFD,
      0 0 180px rgba(250,251,253,0.95),
      0 0 240px rgba(250,251,253,0.9),
      0 0 300px rgba(250,251,253,0.8);
  }
  .regime { color: #111827; }
  .fi { color: #00A88E; letter-spacing: -2px; }
  /* Hide the TradingView watermark */
  [class*="apply-common-tooltip"] { display: none !important; }
  a[href*="tradingview"] { display: none !important; }
</style>
</head>
<body>
<div id="chart"></div>
<div class="vignette"></div>
<div class="content">
  <div class="wordmark"><span class="regime">REGIME</span><span class="fi">.fi</span></div>
</div>
<script>
  // Seed a deterministic random so the chart looks the same every render
  let seed = 42;
  function rand() {
    seed = (seed * 16807 + 0) % 2147483647;
    return (seed - 1) / 2147483646;
  }

  const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    width: 1500,
    height: 500,
    layout: {
      background: { color: '#FAFBFD' },
      textColor: 'transparent',
      attributionLogo: false,
    },
    grid: {
      vertLines: { color: 'rgba(45,106,255,0.10)' },
      horzLines: { color: 'rgba(45,106,255,0.10)' },
    },
    timeScale: {
      visible: false,
      borderVisible: false,
    },
    rightPriceScale: {
      visible: false,
      borderVisible: false,
    },
    leftPriceScale: {
      visible: false,
      borderVisible: false,
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Hidden,
    },
    handleScroll: false,
    handleScale: false,
  });

  const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
    upColor: '#00B377',
    downColor: '#E0435C',
    borderUpColor: '#00B377',
    borderDownColor: '#E0435C',
    wickUpColor: '#00B377',
    wickDownColor: '#E0435C',
    lastValueVisible: false,
    priceLineVisible: false,
  });

  // Generate realistic uptrending OHLC with organic price action
  function generateUptrend(count) {
    const data = [];
    let price = 50;
    const baseDate = new Date('2024-01-01');

    // Phases: accumulation, breakout, consolidation, trend, pullback
    const phases = [
      { len: 12, drift: 0.1,  vol: 2.5, upPct: 0.50 }, // accumulation (choppy)
      { len: 8,  drift: 1.2,  vol: 3.5, upPct: 0.75 }, // breakout
      { len: 10, drift: -0.1, vol: 2.0, upPct: 0.40 }, // pullback
      { len: 6,  drift: 0.05, vol: 1.5, upPct: 0.50 }, // consolidation (tight range)
      { len: 12, drift: 0.8,  vol: 3.0, upPct: 0.65 }, // trend continuation
      { len: 5,  drift: -0.3, vol: 2.5, upPct: 0.35 }, // minor pullback
      { len: 15, drift: 1.0,  vol: 4.0, upPct: 0.70 }, // strong trend
      { len: 7,  drift: 0.0,  vol: 1.8, upPct: 0.45 }, // distribution/consolidation
      { len: 10, drift: 1.5,  vol: 5.0, upPct: 0.75 }, // blow-off breakout
    ];

    let candleIdx = 0;

    for (const phase of phases) {
      for (let j = 0; j < phase.len && candleIdx < count; j++, candleIdx++) {
        const date = new Date(baseDate);
        date.setDate(date.getDate() + candleIdx);
        const time = date.toISOString().split('T')[0];

        const vol = phase.vol * (0.5 + rand() * 1.0);
        const isUp = rand() < phase.upPct;

        let open, close, high, low;
        open = price;

        if (isUp) {
          const bodySize = phase.drift + rand() * vol;
          close = open + Math.max(bodySize, 0.1);
          high = close + rand() * vol * 0.6;
          low = open - rand() * vol * 0.4;
        } else {
          const bodySize = Math.abs(phase.drift * 0.5) + rand() * vol * 0.7;
          close = open - Math.max(bodySize, 0.1);
          high = open + rand() * vol * 0.5;
          low = close - rand() * vol * 0.4;
        }

        // Occasional big candle (momentum bar)
        if (rand() < 0.07) {
          if (isUp) {
            close = open + vol * 2.2;
            high = close + rand() * vol * 0.3;
            low = open - rand() * vol * 0.2;
          } else {
            close = open - vol * 1.5;
            low = close - rand() * vol * 0.3;
            high = open + rand() * vol * 0.2;
          }
        }

        // Occasional doji/spinning top
        if (rand() < 0.08) {
          close = open + (rand() - 0.5) * 0.5;
          high = Math.max(open, close) + rand() * vol * 1.2;
          low = Math.min(open, close) - rand() * vol * 1.2;
        }

        // Occasional hammer/inverted hammer
        if (rand() < 0.05) {
          const body = Math.abs(close - open);
          if (isUp) {
            low = Math.min(open, close) - vol * 2;
            high = Math.max(open, close) + vol * 0.2;
          } else {
            high = Math.max(open, close) + vol * 2;
            low = Math.min(open, close) - vol * 0.2;
          }
        }

        data.push({
          time,
          open: Math.round(open * 100) / 100,
          high: Math.round(Math.max(high, open, close) * 100) / 100,
          low: Math.round(Math.min(low, open, close) * 100) / 100,
          close: Math.round(close * 100) / 100,
        });

        price = close;
      }
    }
    return data;
  }

  const data = generateUptrend(85);
  candleSeries.setData(data);
  chart.timeScale().fitContent();
</script>
</body>
</html>
